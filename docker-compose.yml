# Local development database. Production (Hetzner) uses the same image tag.
# Postgres 18 images keep data under /var/lib/postgresql (not .../data).
services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: sugar
      POSTGRES_PASSWORD: sugar
      POSTGRES_DB: sugar_ship
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sugar -d sugar_ship"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
